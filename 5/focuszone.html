<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusOn - Tablet Optimized</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3ecf8e;
    --primary-dark: #27b577;
    --primary-glow: rgba(62,207,142,0.18);
    --primary-soft: #edfaf4;
    --bg: #f2f4f8;
    --card: #ffffff;
    --text: #1a1d27;
    --text-mid: #6b7280;
    --text-light: #b0b8c8;
    --border: #e8ecf2;
    --danger: #ff4d6d;
    --shadow-card: 0 2px 20px rgba(0,0,0,0.06);
    --shadow-hover: 0 8px 30px rgba(0,0,0,0.1);
    --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ─── LAYOUT ─── */
  .nav {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 200;
    height: var(--nav-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
  }
  .nav-logo {
    font-family: 'Nunito', sans-serif;
    font-size: 20px; font-weight: 900;
    background: linear-gradient(135deg, #3ecf8e, #27b577);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .nav-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 14px; padding: 4px; }
  .nav-tab {
    cursor: pointer; font-size: 13px; font-weight: 700;
    color: var(--text-light); padding: 8px 16px;
    border-radius: 10px; transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-tab.active { color: var(--primary-dark); background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }

  /* Grid System for Tablet Landscape */
  .main-grid { display: flex; flex-direction: column; gap: 20px; }

  @media (min-width: 850px) {
    .main-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; align-items: start; }
    .side-column { position: sticky; top: calc(var(--nav-h) + 24px); }
  }

  /* ─── CARDS & COMPONENTS ─── */
  .card {
    background: var(--card); border-radius: 24px;
    padding: 24px; box-shadow: var(--shadow-card);
    border: 1px solid var(--border); margin-bottom: 20px;
  }

  .hero-strip {
    background: linear-gradient(135deg, #2dc08a 0%, #3ecf8e 50%, #52e3a3 100%);
    border-radius: 28px; padding: 28px 28px 22px;
    color: white; margin-bottom: 20px;
    position: relative; overflow: hidden;
    box-shadow: 0 8px 32px rgba(62,207,142,0.35);
  }
  .hero-strip::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 180px; height: 180px; background: rgba(255,255,255,0.12); border-radius: 50%;
  }
  .hero-greeting { font-size: 13px; font-weight: 600; opacity: 0.85; margin-bottom: 6px; }
  .hero-title { font-family: 'Nunito', sans-serif; font-size: 26px; font-weight: 900; line-height: 1.2; margin-bottom: 18px; }
  .hero-stats { display: flex; gap: 24px; }
  .hero-stat-val { font-family: 'Nunito', sans-serif; font-size: 28px; font-weight: 900; line-height: 1; }
  .hero-stat-lbl { font-size: 11px; font-weight: 600; opacity: 0.75; margin-top: 4px; }

  .section-title {
    font-size: 13px; font-weight: 700; color: var(--text-light);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 12px; padding-left: 2px;
  }

  /* ─── WEEK CHART ─── */
  .week-chart-wrap { display: flex; align-items: flex-end; gap: 6px; height: 100px; }
  .week-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .week-bar-bg { width: 100%; border-radius: 8px; background: #f0f3f8; overflow: hidden; position: relative; }
  .week-bar-fill { width: 100%; border-radius: 8px; transition: height 0.6s cubic-bezier(.34,1.56,.64,1); position: absolute; bottom: 0; }
  .week-bar-fill.today { background: linear-gradient(180deg, #52e3a3, #27b577); }
  .week-bar-fill.past { background: linear-gradient(180deg, #bde9d8, #9dd9c4); }
  .week-label { font-size: 10px; font-weight: 700; color: var(--text-light); }
  .week-label.today { color: var(--primary-dark); }

  /* ─── QUICK STATS ─── */
  .quick-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  @media (min-width: 850px) { .quick-stats { grid-template-columns: 1fr 1fr; } .qs-card:last-child { grid-column: span 2; } }
  .qs-card {
    background: white; border-radius: 20px; padding: 18px 14px;
    border: 1px solid var(--border); box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .qs-icon { font-size: 22px; }
  .qs-val { font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 900; color: var(--text); }
  .qs-lbl { font-size: 10px; font-weight: 600; color: var(--text-light); text-align: center; }

  /* ─── SUBJECTS ─── */
  .sub-pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .sub-pill {
    display: flex; align-items: center; gap: 7px;
    background: white; border: 1px solid var(--border);
    border-radius: 50px; padding: 8px 14px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: var(--shadow-card); transition: all 0.2s;
  }
  .sub-pill-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ─── RECORD TABLE ─── */
  .record-table { width: 100%; border-collapse: collapse; }
  .record-table th {
    font-size: 10px; font-weight: 700; color: var(--text-light);
    text-transform: uppercase; padding: 0 8px 12px; text-align: center; border-bottom: 1px solid var(--border);
  }
  .record-table td { padding: 14px 8px; border-bottom: 1px solid #f5f7fa; text-align: center; font-size: 13px; }
  .record-table tr:last-child td { border-bottom: none; }
  .sub-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
  }
  .sub-chip-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* ─── TIMER ─── */
  .timer-wrap { text-align: center; padding: 30px 0; }
  .timer-ring {
    width: 220px; height: 220px; margin: 0 auto 28px;
    border-radius: 50%; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: conic-gradient(var(--primary) 0%, #f0f3f8 0%);
    box-shadow: 0 0 0 3px white, 0 0 0 5px var(--border);
  }
  .timer-ring-inner {
    position: absolute; width: 180px; height: 180px;
    background: white; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .timer-num { font-family: 'Nunito', sans-serif; font-size: 42px; font-weight: 900; color: var(--text); }

  /* ─── INPUTS & BUTTONS ─── */
  .input-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-light); margin-bottom: 7px; }
  .input-field {
    width: 100%; padding: 15px 18px; border-radius: 16px;
    border: 1.5px solid var(--border); background: #fafbfc;
    font-family: inherit; font-size: 15px; font-weight: 600; outline: none; margin-bottom: 16px;
  }
  .btn-primary {
    width: 100%; padding: 18px; border-radius: 18px; border: none;
    background: linear-gradient(135deg, #3ecf8e, #27b577);
    color: white; font-weight: 800; font-size: 16px;
    cursor: pointer; box-shadow: 0 4px 16px rgba(62,207,142,0.4);
  }
  .btn-stop { background: linear-gradient(135deg, #ff6b6b, #ee5a24); box-shadow: 0 4px 16px rgba(255,107,107,0.35); }
  .btn-ghost {
    width: 100%; padding: 16px; border-radius: 16px;
    border: 1.5px solid var(--border); background: white;
    color: var(--text-light); font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px;
  }

  /* ─── QUIZ CARD ─── */
  .quiz-card { background: white; border-radius: 24px; padding: 22px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .quiz-word { font-family: 'Nunito', sans-serif; font-size: 28px; font-weight: 900; color: var(--text); text-align: center; margin-bottom: 18px; }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .quiz-option {
    background: var(--bg); border: 2px solid var(--border); border-radius: 14px;
    padding: 12px; cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; transition: all 0.15s;
  }
  .quiz-option.correct { border-color: #3ecf8e; background: #edfaf4; color: #1a7a53; }
  .quiz-option.wrong { border-color: var(--danger); background: #fff0f3; color: var(--danger); }

  /* ─── DROPDOWN ─── */
  .dropdown-trigger {
    width: 100%; padding: 15px 18px; border-radius: 16px;
    border: 1.5px solid var(--border); background: #fafbfc;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; font-weight: 600;
  }
  .dropdown-list {
    background: white; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    border: 1px solid var(--border); z-index: 20; overflow: hidden; position: absolute; width: 100%; margin-top: -10px;
  }
  .dropdown-option { padding: 13px 18px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,20,30,0.5);
    backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-sheet {
    background: white; border-radius: 32px; width: 100%; max-width: 480px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }

  /* ─── UTILS ─── */
  .pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sub-card { background: white; border-radius: 22px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-card); cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const COLORS = ["#3ecf8e","#4a90e2","#ff6b6b","#f6b93b","#a29bfe","#fd79a8","#00cec9","#e17055"];
const DAYS_KO = ['일','월','화','수','목','금','토'];
const VOCAB_WORDS = [{en:"exhume", ko:"발굴하다"},{en:"vague", ko:"모호한"},{en:"ingenious", ko:"기발한"},{en:"susceptible", ko:"민감한"},{en:"obstinate", ko:"고집 센"},{en:"mediocre", ko:"평범한"},{en:"tangible", ko:"유형의"},{en:"fragrant", ko:"향기로운"},{en:"remnant", ko:"잔재"},{en:"exacerbate", ko:"악화시키다"}];

function makeQuiz() {
  const pool = [...VOCAB_WORDS].sort(() => Math.random() - 0.5);
  const correct = pool[0];
  const wrongs = pool.slice(1, 4);
  const opts = [...wrongs, correct].sort(() => Math.random() - 0.5);
  return { correct, opts, chosen: null, streak: 0 };
}

function fmt(sec) {
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtHuman(sec) {
  const m = Math.floor(sec/60), s = sec%60;
  return m === 0 ? `${s}초` : s === 0 ? `${m}분` : `${m}분 ${s}초`;
}
function today() { return new Date().toISOString().split('T')[0]; }
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Components ──
function DonutChart({ pct, color, size = 100 }) {
  const r = 40, circ = 2 * Math.PI * r, dash = (pct / 100) * circ;
  return (
    <svg width={size} height={size} viewBox="0 0 100 100">
      <circle cx="50" cy="50" r={r} fill="none" stroke="#f0f3f8" strokeWidth="12"/>
      <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="12"
        strokeDasharray={`${dash} ${circ}`} strokeDashoffset={circ/4} strokeLinecap="round" style={{transition:'stroke-dasharray 0.6s'}}/>
      <text x="50" y="55" textAnchor="middle" style={{fontSize:'20px', fontWeight:'900', fill: color}}>{pct}%</text>
    </svg>
  );
}

function App() {
  const [view, setView] = useState('home');
  const [subjects, setSubjects] = useState(() => JSON.parse(localStorage.getItem('fo_sub') || '[]'));
  const [sessions, setSessions] = useState(() => JSON.parse(localStorage.getItem('fo_sess') || '[]'));
  const [selectedReport, setSelectedReport] = useState(null);
  
  const [time, setTime] = useState(0);
  const [isRunning, setIsRunning] = useState(false);
  const [isFinished, setIsFinished] = useState(false);
  const [isDropdownOpen, setIsDropdownOpen] = useState(false);
  const timerRef = useRef(null);

  const [logDate, setLogDate] = useState(today());
  const [selectedSub, setSelectedSub] = useState('');
  const [correct, setCorrect] = useState('');
  const [total, setTotal] = useState('');
  const [newSubName, setNewSubName] = useState('');
  const [newSubColor, setNewSubColor] = useState(COLORS[0]);
  const [quizState, setQuizState] = useState(() => makeQuiz());

  useEffect(() => {
    localStorage.setItem('fo_sub', JSON.stringify(subjects));
    localStorage.setItem('fo_sess', JSON.stringify(sessions));
  }, [subjects, sessions]);

  useEffect(() => {
    if (isRunning) timerRef.current = setInterval(() => setTime(p => p + 1), 1000);
    else clearInterval(timerRef.current);
    return () => clearInterval(timerRef.current);
  }, [isRunning]);

  const getSubStats = (name) => {
    const ss = sessions.filter(s => s.subject === name);
    const totalSec = ss.reduce((a, s) => a + s.duration, 0);
    const scored = ss.filter(s => s.score !== null);
    const avgScore = scored.length > 0 ? Math.round(scored.reduce((a,s) => a+s.score, 0)/scored.length) : 0;
    return { totalSec, avgScore, count: ss.length, avgSec: ss.length ? Math.floor(totalSec/ss.length) : 0 };
  };

  const weeklyData = useMemo(() => {
    const arr = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const ds = d.toISOString().split('T')[0];
      const secs = sessions.filter(s => s.date === ds).reduce((a,s) => a+s.duration, 0);
      arr.push({ ds, day: DAYS_KO[d.getDay()], secs, isToday: i===0 });
    }
    const max = Math.max(...arr.map(d => d.secs), 1);
    return arr.map(d => ({ ...d, pct: (d.secs / max) * 100 }));
  }, [sessions]);

  // ── Rendering Views ──
  return (
    <div>
      <nav className="nav">
        <div className="nav-logo">FocusOn</div>
        <div className="nav-tabs">
          {[['home','홈'],['timer','타이머'],['manage','과목관리']].map(([v,l]) => (
            <div key={v} className={`nav-tab ${view===v?'active':''}`} onClick={() => setView(v)}>{l}</div>
          ))}
        </div>
      </nav>

      <div className="container">
        {view === 'home' && (
          <div className="main-grid">
            {/* Left Column */}
            <div className="main-column">
              {/* Quiz */}
              <div className="quiz-card">
                <div className="quiz-header">
                  <div style={{fontSize:11, fontWeight:700, color:'var(--primary-dark)'}}>📝 오늘의 단어</div>
                  <div style={{fontSize:12, fontWeight:700, color:'var(--text-mid)'}}>{quizState.streak > 0 ? `🔥 ${quizState.streak}연속` : '정답은?'}</div>
                </div>
                <div className="quiz-word">{quizState.correct.en}</div>
                <div className="quiz-options">
                  {quizState.opts.map((opt, i) => (
                    <button key={i} className={`quiz-option ${quizState.chosen && opt.en === quizState.correct.en ? 'correct' : (quizState.chosen === opt ? 'wrong' : '')}`}
                      onClick={() => {
                        if(quizState.chosen) return;
                        setQuizState(p => ({...p, chosen: opt, streak: opt.en === p.correct.en ? p.streak + 1 : 0}));
                        setTimeout(() => setQuizState(p => ({...makeQuiz(), streak: p.streak})), 1000);
                      }}>
                      {opt.ko}
                    </button>
                  ))}
                </div>
              </div>

              {/* Hero */}
              <div className="hero-strip">
                <div className="hero-greeting">꾸준함이 실력을 만듭니다 🎯</div>
                <div className="hero-title">오늘 총 {Math.floor(sessions.filter(s=>s.date===today()).reduce((a,s)=>a+s.duration,0)/60)}분<br/>학습 완료!</div>
                <div className="hero-stats">
                  <div>
                    <div className="hero-stat-val">{sessions.filter(s=>s.date===today()).length}회</div>
                    <div className="hero-stat-lbl">학습 세션</div>
                  </div>
                  <div style={{width:1, background:'rgba(255,255,255,0.3)'}}></div>
                  <div>
                    <div className="hero-stat-val">{subjects.length}개</div>
                    <div className="hero-stat-lbl">진행 과목</div>
                  </div>
                </div>
              </div>

              {/* Chart */}
              <div className="card">
                <div className="section-title">주간 학습 현황</div>
                <div className="week-chart-wrap">
                  {weeklyData.map((d,i) => (
                    <div key={i} className="week-col">
                      <div className="week-bar-bg" style={{height: 70}}>
                        <div className={`week-bar-fill ${d.isToday?'today':'past'}`} style={{height: `${d.pct}%`}}/>
                      </div>
                      <div className={`week-label ${d.isToday?'today':''}`}>{d.day}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Subjects pills */}
              <div className="sub-pill-row">
                {subjects.map(s => (
                  <div key={s.id} className="sub-pill" onClick={() => setSelectedReport(s)}>
                    <div className="sub-pill-dot" style={{background: s.color}}/>
                    <span style={{color: s.color}}>{s.name}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Right Column (Side) */}
            <div className="side-column">
              <div className="quick-stats">
                <div className="qs-card"><div className="qs-icon">⏱</div><div className="qs-val">{Math.floor(sessions.reduce((a,s)=>a+s.duration,0)/60)}m</div><div className="qs-lbl">누적 시간</div></div>
                <div className="qs-card"><div className="qs-icon">✍️</div><div className="qs-val">{sessions.length}</div><div className="qs-lbl">총 세션</div></div>
                <div className="qs-card">
                  <div style={{fontSize:11, fontWeight:700, color:'var(--text-light)', marginBottom:4}}>평균 정답률</div>
                  <div className="qs-val" style={{color:'var(--primary)'}}>
                    {sessions.filter(s=>s.score!==null).length ? Math.round(sessions.filter(s=>s.score!==null).reduce((a,s)=>a+s.score,0)/sessions.filter(s=>s.score!==null).length) : 0}%
                  </div>
                </div>
              </div>

              <div className="card" style={{padding:'20px'}}>
                <div className="section-title">최근 학습 기록</div>
                <table className="record-table">
                  <thead><tr><th>과목</th><th>시간</th><th>정답률</th></tr></thead>
                  <tbody>
                    {sessions.slice(0, 8).map(s => {
                      const sub = subjects.find(x => x.name === s.subject);
                      return (
                        <tr key={s.id}>
                          <td><div className="sub-chip" style={{background: hexAlpha(sub?.color||'#ccc', 0.1), color: sub?.color}}>{s.subject}</div></td>
                          <td style={{fontWeight:700}}>{Math.floor(s.duration/60)}분</td>
                          <td style={{color: s.score >= 80 ? 'var(--primary-dark)' : 'var(--text-mid)'}}>{s.score ?? '-'}%</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {view === 'timer' && (
          <div style={{maxWidth:600, margin:'0 auto'}}>
            <div className="card">
              <div className="timer-wrap">
                <div className="timer-ring" style={{background: `conic-gradient(var(--primary) ${(time%3600)/3600*100}%, #f0f3f8 0%)`}}>
                  <div className="timer-ring-inner">
                    <div className="timer-num">{fmt(time)}</div>
                    {isRunning && <div className="pulse" style={{fontSize:12, color:'var(--primary)', fontWeight:800, marginTop:4}}>FOCUSING</div>}
                  </div>
                </div>
              </div>

              {!isFinished ? (
                <div style={{position:'relative'}}>
                  <label className="input-label">과목 선택</label>
                  <div className="dropdown-trigger" onClick={() => !isRunning && setIsDropdownOpen(!isDropdownOpen)}>
                    {selectedSub || <span style={{color:'var(--text-light)'}}>과목을 선택하세요</span>}
                    <span>{isDropdownOpen ? '▲' : '▼'}</span>
                  </div>
                  {isDropdownOpen && (
                    <div className="dropdown-list">
                      {subjects.map(s => (
                        <div key={s.id} className="dropdown-option" onClick={() => {setSelectedSub(s.name); setIsDropdownOpen(false)}}>
                          <div style={{width:10, height:10, borderRadius:'50%', background: s.color}}/>{s.name}
                        </div>
                      ))}
                    </div>
                  )}
                  <button className={`btn-primary ${isRunning ? 'btn-stop' : ''}`} onClick={() => isRunning ? (setIsRunning(false), setIsFinished(true)) : setIsRunning(true)}>
                    {isRunning ? '정지 및 기록' : '학습 시작'}
                  </button>
                </div>
              ) : (
                <div style={{textAlign:'center'}}>
                  <div style={{marginBottom:20, fontWeight:700}}>오늘 {fmtHuman(time)} 공부했네요!</div>
                  <div style={{display:'flex', gap:10, marginBottom:16}}>
                    <input type="number" className="input-field" placeholder="맞힌 문제" value={correct} onChange={e=>setCorrect(e.target.value)}/>
                    <input type="number" className="input-field" placeholder="전체 문제" value={total} onChange={e=>setTotal(e.target.value)}/>
                  </div>
                  <button className="btn-primary" onClick={() => {
                    const s = total > 0 ? Math.round((correct/total)*100) : null;
                    setSessions([{id:Date.now(), subject:selectedSub, duration:time, score:s, date:today()}, ...sessions]);
                    setTime(0); setIsFinished(false); setView('home');
                  }}>저장하기</button>
                </div>
              )}
            </div>
          </div>
        )}

        {view === 'manage' && (
          <div style={{maxWidth:600, margin:'0 auto'}}>
            <div className="card">
              <div className="section-title">새 과목 등록</div>
              <input className="input-field" placeholder="과목 이름" value={newSubName} onChange={e=>setNewSubName(e.target.value)}/>
              <div style={{display:'flex', gap:8, marginBottom:20}}>
                {COLORS.map(c => (
                  <div key={c} onClick={() => setNewSubColor(c)} style={{width:30, height:30, borderRadius:8, background:c, cursor:'pointer', border: newSubColor===c ? '3px solid #1a1d27' : 'none'}}/>
                ))}
              </div>
              <button className="btn-primary" onClick={() => {
                if(!newSubName) return;
                setSubjects([...subjects, {id:Date.now(), name:newSubName, color:newSubColor}]);
                setNewSubName('');
              }}>과목 추가하기</button>
            </div>
            <div className="sub-grid">
              {subjects.map(s => (
                <div key={s.id} className="sub-card" onClick={() => setSelectedReport(s)}>
                  <div style={{height:4, background:s.color, borderRadius:2, marginBottom:10}}/>
                  <div style={{fontWeight:800}}>{s.name}</div>
                  <div style={{fontSize:12, color:'var(--text-mid)', marginTop:4}}>{getSubStats(s.name).count}회 세션</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {selectedReport && (
        <div className="modal-overlay" onClick={() => setSelectedReport(null)}>
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:20}}>
              <h2 style={{color:selectedReport.color}}>{selectedReport.name} 리포트</h2>
              <button onClick={()=>setSelectedReport(null)} style={{border:'none', background:'none', fontSize:24, cursor:'pointer'}}>×</button>
            </div>
            <div style={{display:'flex', gap:20, alignItems:'center', marginBottom:30}}>
              <DonutChart pct={getSubStats(selectedReport.name).avgScore} color={selectedReport.color}/>
              <div>
                <div style={{fontSize:12, color:'var(--text-light)'}}>평균 정답률</div>
                <div style={{fontSize:24, fontWeight:900}}>{getSubStats(selectedReport.name).avgScore}%</div>
              </div>
            </div>
            <button className="btn-ghost" onClick={() => {
              if(confirm('과목을 삭제하시겠습니까?')) {
                setSubjects(subjects.filter(s=>s.id!==selectedReport.id));
                setSessions(sessions.filter(s=>s.subject!==selectedReport.name));
                setSelectedReport(null);
              }
            }}>과목 삭제</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
